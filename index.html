<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прыг-скок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="version" content="0.2.2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one-screen app in a bright daytime world. Draw screen = logo, square paper sheet, toolbar, big CTA. Game screen = full-bleed canvas + HUD. Single deliberate light look. */
:root{
  --sky-top:#4FC3F7;
  --sky-bottom:#B8ECFF;
  --ink:#1B2A4A;
  --orange:#FF8A1F;
  --grass:#5ED15E;
  --berry:#FF4D8D;
  --sun:#FFD43B;
  --paper:#FFFFFF;
  --veil:rgba(27,42,74,.5);
  --font-display:'Nunito','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  position:relative;margin:0;overflow:hidden;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
  background-color:var(--sky-top);
  color:var(--ink);font-family:var(--font-display);font-weight:800;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}

/* ---------- cartoon buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;min-width:48px;padding:0 18px;
  background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:18px;
  box-shadow:0 5px 0 var(--ink);
  font-weight:900;font-size:18px;line-height:1;cursor:pointer;
  touch-action:manipulation;transition:transform .08s ease,box-shadow .08s ease;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--paper);outline-offset:3px}
.btn svg{width:24px;height:24px;flex:none}
.btn.icon{padding:0;width:48px}
.btn.orange{background:var(--orange)}
.btn.green{background:var(--grass)}
.btn.berry{background:var(--berry)}
.btn.big{min-height:64px;font-size:26px;border-radius:22px;width:100%}
.btn.big svg{width:30px;height:30px}

/* ---------- draw screen ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
#draw{
  left:0;right:0;margin:0 auto;max-width:560px;
  padding-block:10px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  gap:12px;
}
.sky-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sky-deco i{position:absolute;background:var(--paper);border-radius:999px;opacity:.85}
.sky-deco i::before,.sky-deco i::after{content:"";position:absolute;background:inherit;border-radius:50%}
.sky-deco i::before{width:55%;height:160%;left:15%;bottom:20%}
.sky-deco i::after{width:40%;height:130%;right:12%;bottom:25%}
.sky-deco .c1{width:120px;height:34px;top:9%;left:-30px}
.sky-deco .c2{width:90px;height:26px;top:16%;right:-20px}
.sky-deco .c3{width:70px;height:20px;top:4%;right:30%}

header{position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.logo{
  margin:0;font-weight:900;font-size:clamp(36px,11vw,54px);line-height:1;letter-spacing:.5px;
  display:flex;
}
.logo span{
  display:inline-block;color:var(--c,var(--paper));
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;
  text-shadow:0 4px 0 var(--ink);
  animation:hop 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * 90ms);
}
.logo .gap{width:.18em}
@keyframes hop{0%,70%,100%{transform:translateY(0) rotate(var(--r,0deg))}78%{transform:translateY(-8px) rotate(var(--r,0deg))}86%{transform:translateY(0) rotate(var(--r,0deg))}}

#paperWrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#paper{
  position:relative;width:280px;height:280px;max-width:100%;
  background:var(--paper);border:4px solid var(--ink);border-radius:26px;
  box-shadow:0 6px 0 var(--ink);overflow:hidden;
}
#paper.pop{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05) rotate(-1.5deg)}100%{transform:scale(1)}}
#pad{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#padHint{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  pointer-events:none;color:#9AA6BD;font-size:20px;text-align:center;padding:16px;
}
#padHint svg{width:64px;height:64px;animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-8deg) translateX(-4px)}50%{transform:rotate(8deg) translateX(4px)}}

.tools{display:flex;flex-direction:column;gap:10px;flex:none}
#colors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.swatch{
  height:48px;border:3px solid var(--ink);border-radius:16px;background:var(--sw);
  box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation;padding:0;
  transition:transform .1s ease,box-shadow .1s ease;
}
.swatch[aria-pressed="true"]{transform:translateY(-3px);box-shadow:0 7px 0 var(--ink),inset 0 0 0 4px var(--paper)}
.swatch:focus-visible{outline:4px solid var(--paper);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px}
.row .spacer{flex:1}
.size-dot{display:block;border-radius:50%;background:var(--ink)}
.btn.size[aria-pressed="true"]{background:var(--sun)}

.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* ---------- game screen ---------- */
#game{background:var(--sky-top)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{
  position:absolute;top:10px;
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:flex-start;gap:8px;pointer-events:none;
}
.hud .btn{pointer-events:auto}
.scorebox{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.big-num{
  font-weight:900;font-size:44px;line-height:1;color:var(--paper);
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;
  font-variant-numeric:tabular-nums;
}
.coin-pill{
  align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
  background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 4px;
  font-size:18px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink);
}
.coin-ico{width:24px;height:24px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:inline-block}
#hint{
  position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;text-align:center;padding:0 16px;
}
#hint .t1{
  font-size:clamp(30px,9vw,46px);font-weight:900;color:var(--sun);line-height:1.05;
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);
  animation:pulse 1.1s ease-in-out infinite;
}
#hint .t2{font-size:18px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 14px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- overlays ---------- */
.overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--veil);
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  z-index:5;
}
.card{
  position:relative;width:min(100%,360px);max-height:100%;overflow:auto;
  background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);
  padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  animation:cardIn .35s cubic-bezier(.2,1.4,.4,1);
}
@keyframes cardIn{from{transform:translateY(30px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0;font-size:30px;font-weight:900;line-height:1.1;text-wrap:balance}
.hero-frame{
  width:132px;height:132px;border-radius:50%;border:4px solid var(--ink);
  background:radial-gradient(circle at 50% 35%,var(--sky-bottom),var(--sky-top));
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;
}
.hero-frame img{max-width:84%;max-height:84%;object-fit:contain}
.ribbon{
  background:var(--berry);color:var(--paper);border:3px solid var(--ink);border-radius:12px;
  padding:6px 14px;font-size:20px;font-weight:900;transform:rotate(-3deg);box-shadow:0 4px 0 var(--ink);
}
.stats{display:flex;gap:10px;width:100%}
.stat{flex:1;min-width:0;border:3px solid var(--ink);border-radius:16px;padding:8px 6px;background:var(--sky-bottom)}
.stat b{display:block;font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stat small{font-size:14px}
.card .actions{display:flex;flex-direction:column;gap:12px;width:100%}
.card .actions .btn{width:100%}
.card:not(.armed) .actions{pointer-events:none}
.muted-note{font-size:13px;color:#56637D;margin:0}
.hud-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#lives{display:flex;gap:2px}
#lives svg{width:30px;height:30px;transition:transform .25s ease,opacity .25s ease,filter .25s ease}
#lives svg.lost{opacity:.35;filter:grayscale(1);transform:scale(.78)}
#lives.hit{animation:shake .4s ease}
.btn.photo{min-height:64px;border-radius:22px;flex:none;font-size:18px}
.tools .row .btn.big{flex:1;width:auto;min-width:0}
#photoModal{z-index:9}
#photoPreview{display:block;max-width:100%;max-height:40vh;width:auto;height:auto;border:3px solid var(--ink);border-radius:16px;
  background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom))}
.slider{display:flex;flex-direction:column;gap:6px;width:100%;font-size:16px;text-align:left}
.slider input{width:100%;height:36px;accent-color:var(--orange)}
@media (max-width:380px){ .btn.photo .lbl{display:none} .btn.photo{width:64px;padding:0} }
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#shareImg{display:block;width:auto;max-width:100%;max-height:52vh;border:3px solid var(--ink);border-radius:16px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
#shareModal{z-index:8}

@media (max-height:640px){
  .card{padding:14px;gap:9px}
  .hero-frame{width:92px;height:92px}
  .card h2{font-size:24px}
  .stat b{font-size:28px}
  .btn.big{min-height:56px;font-size:22px}
}
@media (prefers-reduced-motion: reduce){
  .logo span,#padHint svg,#hint .t1{animation:none}
  .card{animation:none}
  #paper.pop{animation:none}
}
</style>

</head>
<body>
<div class="sky-deco" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>

<!-- ============ DRAW ============ -->
<section id="draw" class="screen" aria-label="Нарисуй героя">
  <header>
    <h1 class="logo" aria-label="Прыг-скок">
      <span style="--i:0;--c:#FF8A1F;--r:-4deg">П</span><span style="--i:1;--c:#FFD43B;--r:3deg">р</span><span style="--i:2;--c:#5ED15E;--r:-2deg">ы</span><span style="--i:3;--c:#FF4D8D;--r:4deg">г</span><span style="--i:4;--c:#FFFFFF">-</span><span style="--i:5;--c:#FFD43B;--r:-3deg">с</span><span style="--i:6;--c:#FF8A1F;--r:2deg">к</span><span style="--i:7;--c:#5ED15E;--r:-4deg">о</span><span style="--i:8;--c:#FF4D8D;--r:3deg">к</span>
    </h1>
  </header>

  <div id="paperWrap">
    <div id="paper">
      <canvas id="pad" aria-label="Лист для рисования"></canvas>
      <div id="padHint">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M44 6l14 14-30 30-17 4 4-17z" fill="#FFD43B" stroke="#1B2A4A" stroke-width="4" stroke-linejoin="round"/><path d="M38 12l14 14" stroke="#1B2A4A" stroke-width="4"/><path d="M15 37l12 12" stroke="#1B2A4A" stroke-width="4"/></svg>
        <div>Нарисуй героя пальцем</div>
      </div>
    </div>
  </div>

  <div class="tools">
    <div id="colors" role="group" aria-label="Цвет"></div>
    <div class="row">
      <div class="row" role="group" aria-label="Толщина">
        <button class="btn icon size" data-size="0" aria-label="Тонкая кисть" aria-pressed="false"><span class="size-dot" style="width:8px;height:8px"></span></button>
        <button class="btn icon size" data-size="1" aria-label="Средняя кисть" aria-pressed="true"><span class="size-dot" style="width:14px;height:14px"></span></button>
        <button class="btn icon size" data-size="2" aria-label="Толстая кисть" aria-pressed="false"><span class="size-dot" style="width:22px;height:22px"></span></button>
      </div>
      <span class="spacer"></span>
      <button id="undo" class="btn icon" aria-label="Отменить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
      </button>
      <button id="clear" class="btn icon" aria-label="Очистить лист">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
      </button>
    </div>
    <div class="row">
      <button id="photoBtn" class="btn photo" aria-label="Загрузить фото рисунка">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span class="lbl">Фото</span>
      </button>
      <button id="go" class="btn orange big">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2" stroke-linejoin="round"/></svg>
        Оживить!
      </button>
    </div>
    <input id="photoInput" type="file" accept="image/*" hidden>
  </div>
</section>

<div id="photoModal" class="overlay" hidden>
  <div class="card armed">
    <h2>Рисунок с бумаги</h2>
    <canvas id="photoPreview" aria-label="Вырезанный рисунок"></canvas>
    <p id="photoMsg" class="muted-note">Двигай ползунок, пока вокруг рисунка не станет чисто</p>
    <label class="slider" for="photoTh">Чистка фона
      <input id="photoTh" type="range" min="8" max="110" value="42">
    </label>
    <div class="actions">
      <button id="photoPlay" class="btn orange big">Играть!</button>
      <button id="photoCancel" class="btn">Отмена</button>
    </div>
  </div>
</div>

<!-- ============ GAME ============ -->
<section id="game" class="screen" aria-label="Игра" hidden>
  <canvas id="stage" aria-label="Игра: тапни, чтобы прыгнуть"></canvas>
  <div class="hud">
    <div class="scorebox">
      <div id="score" class="big-num" aria-live="off">0</div>
      <div class="hud-row">
        <div class="coin-pill"><span class="coin-ico" aria-hidden="true"></span><span id="coins">0</span></div>
        <div id="lives" role="img" aria-label="Жизни: 3"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#FF4D8D" stroke="#1B2A4A" stroke-width="2.2" stroke-linejoin="round"/><path d="M7 8.2c.6-1 1.6-1.4 2.6-1.1" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#FF4D8D" stroke="#1B2A4A" stroke-width="2.2" stroke-linejoin="round"/><path d="M7 8.2c.6-1 1.6-1.4 2.6-1.1" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#FF4D8D" stroke="#1B2A4A" stroke-width="2.2" stroke-linejoin="round"/><path d="M7 8.2c.6-1 1.6-1.4 2.6-1.1" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      </div>
    </div>
    <button id="sound" class="btn icon" aria-label="Звук"></button>
    <button id="pause" class="btn icon" aria-label="Пауза">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
    </button>
  </div>
  <div id="hint">
    <div class="t1">Тапни — прыгай!</div>
    <div class="t2">Ещё тап в воздухе — двойной прыжок</div>
  </div>

  <div id="pauseMenu" class="overlay" hidden>
    <div class="card armed">
      <h2>Пауза</h2>
      <div class="actions">
        <button id="resume" class="btn orange big">Продолжить</button>
        <button id="pauseNew" class="btn green">Нарисовать нового</button>
      </div>
      <p class="muted-note">Прыг-скок · версия <span class="ver"></span></p>
    </div>
  </div>

  <div id="over" class="overlay" hidden>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <div class="card" id="overCard">
      <div id="newRecord" class="ribbon" hidden>Новый рекорд!</div>
      <div class="hero-frame"><img id="overHero" alt="Твой герой"></div>
      <h2 id="overTitle">Игра окончена</h2>
      <div class="stats">
        <div class="stat"><b id="overScore">0</b><small>очки</small></div>
        <div class="stat"><b id="overBest">0</b><small>рекорд</small></div>
      </div>
      <div class="actions">
        <button id="again" class="btn orange big">Ещё раз</button>
        <button id="newHero" class="btn green">Нарисовать нового</button>
        <button id="share" class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg>
          Поделиться
        </button>
      </div>
    </div>
  </div>

  <div id="shareModal" class="overlay" hidden>
    <div class="card armed">
      <h2>Картинка готова</h2>
      <img id="shareImg" alt="Карточка с героем и очками">
      <p class="muted-note">Зажми картинку пальцем и выбери «Сохранить»</p>
      <div class="actions">
        <button id="download" class="btn orange" hidden>Скачать картинку</button>
        <button id="shareClose" class="btn">Закрыть</button>
      </div>
    </div>
  </div>
</section>

<script>

  return actx;
}
function tone(f, f2, dur, type, vol, delay){
  if (muted) return;

function drawStroke(ctx, st, size){
  const p = st.p;
  ctx.strokeStyle = st.c; ctx.fillStyle = st.c;
  ctx.lineWidth = Math.max(1, st.w * size);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  }

    const mx = (p[i][0] + p[i+1][0]) / 2, my = (p[i][1] + p[i+1][1]) / 2;
    ctx.quadraticCurveTo(p[i][0]*size, p[i][1]*size, mx*size, my*size);

function ptOf(e){

let hero = null; // {img: canvas, aspect, url}
function tint(src, col){
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}
function ring(ctx, sil, o, r){
  for (const rr of [r, r*.55]){
    for (let a = 0; a < Math.PI*2; a += Math.PI/16) ctx.drawImage(sil, o + Math.cos(a)*rr, o + Math.sin(a)*rr);
  }
  ctx.drawImage(sil, o, o);
}
function stickerFrom(src){
  const SW = src.width, SH = src.height;
  const sx = src.getContext('2d', {willReadFrequently:true});
  const d = sx.getImageData(0, 0, SW, SH).data;
  let x0 = SW, y0 = SH, x1 = -1, y1 = -1;
  for (let y = 0; y < SH; y++){
    for (let x = 0; x < SW; x++){
      if (d[(y*SW + x)*4 + 3] > 60){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
  }
  if (x1 < 0) return null;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const k = Math.min(240 / bh, 380 / bw);
  const iw = Math.max(2, Math.round(bw*k)), ih = Math.max(2, Math.round(bh*k));
  const art = document.createElement('canvas'); art.width = iw; art.height = ih;
  const ax = art.getContext('2d'); ax.imageSmoothingQuality = 'high';
  ax.drawImage(src, x0, y0, bw, bh, 0, 0, iw, ih);
  const O = 22;
  const out = document.createElement('canvas'); out.width = iw + O*2; out.height = ih + O*2;
  const ox = out.getContext('2d');
  ring(ox, tint(art, C.ink), O, 19);
  ring(ox, tint(art, C.white), O, 12);
  ox.drawImage(art, O, O);
  let url = ''; try{ url = out.toDataURL('image/png'); }catch(e){}
  return {img:out, aspect: out.width / out.height, url};
}
function buildHero(){
  if (!strokes.length) return null;
  const S = 512;
  const src = document.createElement('canvas'); src.width = S; src.height = S;
  const sx = src.getContext('2d', {willReadFrequently:true});
  strokes.forEach(st => drawStroke(sx, st, S));
  return stickerFrom(src);
}

function preparePhoto(im){
  const max = 900, k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.max(1, Math.round(im.naturalWidth*k)), h = Math.max(1, Math.round(im.naturalHeight*k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(im, 0, 0, w, h);
  // paper brightness map: shrink hard (lines vanish), then stretch back
  const sm = document.createElement('canvas'); sm.width = 16; sm.height = Math.max(4, Math.round(16*h/w));
  const smx = sm.getContext('2d'); smx.imageSmoothingQuality = 'high'; smx.drawImage(c, 0, 0, sm.width, sm.height);
  const bgc = document.createElement('canvas'); bgc.width = w; bgc.height = h;

function runCut(){
  if (!photo || cutPending) return;
  cutPending = true;
  requestAnimationFrame(() => {
    cutPending = false;
    const th = +$('photoTh').value;
    const {w, h, px, bg} = photo, s = px.data;
    const out = new ImageData(w, h), o = out.data;
    for (let i = 0; i < s.length; i += 4){
      const r = s[i], gg = s[i+1], b = s[i+2];
      const dark = Math.max(bg[i] - r, bg[i+1] - gg, bg[i+2] - b);
      const sat = (Math.max(r, gg, b) - Math.min(r, gg, b)) - (Math.max(bg[i], bg[i+1], bg[i+2]) - Math.min(bg[i], bg[i+1], bg[i+2]));
      const score = Math.max(dark, sat*1.1);
      const a = Math.max(0, Math.min(1, (score - th) / 22));
      o[i] = r; o[i+1] = gg; o[i+2] = b; o[i+3] = Math.round(a*255);
    }
    if (!cut){ cut = document.createElement('canvas'); }
    cut.width = w; cut.height = h; cut.getContext('2d').putImageData(out, 0, 0);
    pvx.clearRect(0, 0, w, h); pvx.drawImage(cut, 0, 0);
  });
}

const stage = $('stage'), g = stage.getContext('2d');
let W = 0, H = 0, U = 60, GY = 0, sd = 1, skyGrad = null;
const G = 30, JUMP_H = 1.95, JV = Math.sqrt(2*G*JUMP_H), HERO_H = 1.1;
const SPEED0 = 3.0, SPEED_MAX = 6.5, ACCEL = .035, LIVES = 3, INVULN = 1.6;
let S = null, raf = 0, last = 0;
let best = +store.get('best', 0) || 0;

/* textures made with image generation (FLUX Krea) */
const tex = {};
Object.keys(window.PRYG_ASSETS || {}).forEach(k => { const im = new Image(); im.onload = () => { tex[k] = im; }; im.src = window.PRYG_ASSETS[k]; });

function resizeStage(){

function newState(){

    lives:LIVES, inv:0, obs:[], coinArr:[], parts:[], cursor:0, deadT:0, shake:0,
    h:{y:0, vy:0, ground:true, jumps:0, squash:0, spin:0, rot:0}
  };
}
function heroX(){ return Math.max(.9, Math.min(2.2, (W/U)*.24)); }
function heroW(){ return HERO_H * (hero ? hero.aspect : 1); }

function showGame(){

function jump(){

  if (S.mode !== 'play') return;

  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){ e.preventDefault(); ac(); jump(); }

function spawnObstacle(x){
  const r = Math.random();
  let o;
  if (S.dist > 120 && r < .2) o = {type:'bird', x, h:.72, y0:1.32 + Math.random()*.2};
  else if (r < .45) o = {type:'block', x, h:.68 + Math.random()*.08, y0:0};
  else if (r < .75) o = {type:'hedge', x, h:.62, y0:0};
  else o = {type:'tall', x, h:1.0 + Math.random()*.08, y0:0};
  o.w = widthFor(o.type, o.h);
  o.ph = Math.random()*6;
  S.obs.push(o);
  if (o.type === 'bird'){
    for (let i = 0; i < 4; i++) S.coinArr.push({x: x - .4 + i*.55, y: .45, ph: i});
  } else if (Math.random() < .65){
    const cx = x + o.w/2;
    for (let i = -2; i <= 2; i++){
      const t = i / 2.6;
      S.coinArr.push({x: cx + i*.55, y: o.h + .55 + (1 - t*t)*.55, ph: i});
    }
  }
  return o;
}
const SPR = {block:'stump', tall:'cactus', hedge:'hedge', bird:'bird'};
const DEF_W = {block:.78, tall:.62, hedge:.95, bird:.85};
function widthFor(type, h){ const im = tex[SPR[type]]; return im ? h*im.width/im.height : DEF_W[type]; }
function gapFor(sp){ return Math.max(3.4, sp*1.1) + Math.random()*sp*.9; }

function update(dt){
  const s = S, h = s.h;
  s.t += dt;
  if (s.mode === 'play'){
    s.playT += dt;
    s.speed = Math.min(SPEED_MAX, SPEED0 + s.playT*ACCEL);
  } else if (s.mode === 'ready'){
    s.speed = 0;
  } else if (s.mode === 'dying'){
    s.speed *= Math.pow(.02, dt);
  }
  const mv = s.speed*dt;
  s.dist += mv;
  for (const o of s.obs) o.x -= mv;
  for (const c of s.coinArr) c.x -= mv;
  s.obs = s.obs.filter(o => o.x + o.w > -2);
  s.coinArr = s.coinArr.filter(c => c.x > -2 && !c.got);
  if (s.mode === 'play'){
    s.cursor -= mv;
    if (s.cursor < W/U + 1){
      const o = spawnObstacle(s.cursor);
      s.cursor += o.w + gapFor(s.speed);
    }
  }
  if (s.mode === 'play' || s.mode === 'ready'){
    if (!h.ground){
      h.vy -= G*dt; h.y += h.vy*dt;
      if (h.y <= 0){
        h.y = 0; h.vy = 0; h.ground = true; h.jumps = 0; h.squash = 1;
        puff(heroX(), 0, 7, C.white);
      }
    }
  } else if (s.mode === 'dying'){
    h.vy -= G*dt; h.y += h.vy*dt; h.rot += dt*9;
    s.deadT += dt;
    if (s.deadT > .85 && $('over').hidden) showOver();
  }
  h.squash *= Math.pow(.0005, dt);
  if (h.spin > 0) h.spin = Math.max(0, h.spin - dt);
  if (s.inv > 0) s.inv = Math.max(0, s.inv - dt);
  if (s.mode === 'play'){
    const hx = heroX(), hw = heroW()*.6, hh = HERO_H*.76;
    const L = hx - hw/2, R = hx + hw/2, B = h.y + .08, T = h.y + hh;
    if (s.inv <= 0){
      for (const o of s.obs){
        let l = o.x + o.w*.12, r = o.x + o.w*.88, b = o.y0 + .02, t = o.y0 + o.h*.88;
        if (o.type === 'tall'){ l = o.x + o.w*.22; r = o.x + o.w*.78; t = o.h*.92; }
        if (o.type === 'hedge'){ l = o.x + o.w*.12; r = o.x + o.w*.9; t = o.h*.75; }
        if (o.type === 'bird'){ l = o.x + o.w*.15; r = o.x + o.w*.85; b = o.y0 + o.h*.15; t = o.y0 + o.h*.85; }
        if (R > l && L < r && T > b && B < t){ hurt(); break; }
      }
    }
    const cy = h.y + HERO_H*.5;
    for (const c of s.coinArr){
      if (!c.got && Math.hypot(c.x - hx, c.y - cy) < .62){
        c.got = true; s.coins++; sfx.coin(); burst(c.x, c.y, 6, C.sun);
      }
    }
    s.score = Math.floor(s.dist*2) + s.coins*10;
  }
  for (const p of s.parts){ p.life -= dt; p.x += p.vx*dt - (p.world ? mv : 0); p.y += p.vy*dt; p.vy -= (p.g || 0)*dt; }
  s.parts = s.parts.filter(p => p.life > 0);
  if (s.shake > 0) s.shake = Math.max(0, s.shake - dt);
}
function puff(x, y, n, col){
  for (let i = 0; i < n; i++) S.parts.push({x: x + (Math.random()-.5)*.6, y: y + .05, vx: -1 - Math.random()*1.5, vy: .4 + Math.random()*1.2, g: 2, life: .35 + Math.random()*.2, max:.55, r: .07 + Math.random()*.07, col, world:true});
}
function burst(x, y, n, col){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, v = 1.5 + Math.random()*2.5;

function rr(x, y, w, h, r){

const sy = y => GY - y*U;
const sx = x => x*U;
function tiles(img, y, h, off){

    if (i % 2){ g.save(); g.translate(x + w, 0); g.scale(-1, 1); g.drawImage(img, -.5, y, w + 1, h); g.restore(); }

function groundShadow(cx, w, k){ g.fillStyle = `rgba(27,42,74,${.25*(k == null ? 1 : k)})`; g.beginPath(); g.ellipse(cx, GY + U*.03, w*.55, U*.09, 0, 0, Math.PI*2); g.fill(); }

}

    g.fillStyle = C.ink; g.beginPath(); g.arc(x + w*.02, base - h*.34, U*.06, 0, Math.PI*2); g.fill();
    g.fillStyle = C.white; g.beginPath(); g.arc(x + w*.25, base - h*.46, U*.075, 0, Math.PI*2); g.fill(); outline();

function drawHero(t){

}

function confetti(){
  const cv = $('confetti'), x = cv.getContext('2d');
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = r.width*d; cv.height = r.height*d; x.setTransform(d, 0, 0, d, 0, 0);
  const cols = [C.orange, C.sun, C.grass, C.berry, C.white, '#2E7BFF'];
  const ps = Array.from({length:90}, () => ({x: Math.random()*r.width, y: -20 - Math.random()*r.height*.5, vx: (Math.random()-.5)*80, vy: 120 + Math.random()*160, a: Math.random()*6, va: (Math.random()-.5)*10, w: 6 + Math.random()*6, h: 10 + Math.random()*8, c: cols[Math.floor(Math.random()*cols.length)]}));
  let t0 = performance.now(), lt = t0;
  cancelAnimationFrame(confettiRaf);
  const step = now => {
    const dt = Math.min(.033, (now - lt)/1000); lt = now;
    x.clearRect(0, 0, r.width, r.height);
    for (const p of ps){ p.x += p.vx*dt; p.y += p.vy*dt; p.a += p.va*dt; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.w/2, -p.h/2, p.w, p.h); x.restore(); }

  };
  confettiRaf = requestAnimationFrame(step);
}

  x.font = `900 96px ${FONT}`; const lw = x.measureText(label).width;
  const bw = Math.min(980, lw + 120), bx = (cw - bw)/2, by = 1440;
  x.fillStyle = C.ink; roundRectPath(x, bx, by + 12, bw, 150, 40); x.fill();
  x.fillStyle = C.white; roundRectPath(x, bx, by, bw, 150, 40); x.fill(); x.lineWidth = 9; x.strokeStyle = C.ink; x.stroke();
  x.fillStyle = C.ink; x.textAlign = 'center'; x.fillText(label, cw/2, by + 110);
  x.font = `800 46px ${FONT}`; x.fillStyle = C.ink;
  x.fillText(`и ${coins} ${plural(coins, 'монетка', 'монетки', 'монеток')}`, cw/2, by + 230);
  // pill
  x.font = `900 48px ${FONT}`;
  const pill = 'Нарисуй героя и играй!', pw = x.measureText(pill).width + 90, px2 = (cw - pw)/2, py = 1720;
  x.fillStyle = C.ink; roundRectPath(x, px2, py + 9, pw, 100, 50); x.fill();
  x.fillStyle = C.orange; roundRectPath(x, px2, py, pw, 100, 50); x.fill(); x.lineWidth = 7; x.stroke();
  x.fillStyle = C.ink; x.fillText(pill, cw/2, py + 68);
  return new Promise(res => c.toBlob(b => res(b), 'image/png'));
}
function roundRectPath(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
let shareUrl = '';
$('share').addEventListener('click', async () => {
  track('share');
  const blob = await makeCard();
  if (!blob) return;
  try{
    const file = new File([blob], 'prygskok.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Прыг-скок'});
      return;
    }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  if (shareUrl) URL.revokeObjectURL(shareUrl);
  shareUrl = URL.createObjectURL(blob);
  $('shareImg').src = shareUrl;
  let top = false; try{ top = window.top === window; }catch(e){}
  $('download').hidden = !top;
  $('shareModal').hidden = false;
  $('shareClose').focus({preventScroll:true});
});
$('download').addEventListener('click', () => {
  if (!shareUrl) return;
  const a = document.createElement('a'); a.href = shareUrl; a.download = 'prygskok.png';
  document.body.appendChild(a); a.click(); a.remove();
});
$('shareClose').addEventListener('click', () => { $('shareModal').hidden = true; });

/* ---------- start ---------- */
redraw();
requestAnimationFrame(fitPaper);
})();
</script>
